[package]
name = "awaytime-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[lib]
name = "awaytime_desktop"
crate-type = ["rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
awaytime-core = { path = "../crates/awaytime-core" }
awaytime-runtime = { path = "../crates/awaytime-runtime" }
awaytime-persistence = { path = "../crates/awaytime-persistence" }
serde.workspace = true
serde_json.workspace = true
chrono = "0.4"
iana-time-zone = "0.1"
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_Foundation", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"
