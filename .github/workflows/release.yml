name: AwayTime pre-release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: '1'

permissions:
  contents: read

# Preserve every main revision, including when another push arrives during a build.
concurrency:
  group: awaytime-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/phase0.yml

  build:
    needs: checks
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            extension: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            extension: AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build installer
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Collect installer
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_EXTENSION: ${{ matrix.extension }}
        run: python scripts/collect_release.py
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.target }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [checks, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: installer-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify complete release and generate checksums
        run: |
          python scripts/collect_release.py --verify
          cd artifacts/release
          sha256sum AwayTime-* > SHA256SUMS.txt
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          cp docs/PRE_RELEASE_NOTES.md artifacts/release-notes.md
          printf '\nCommit: `%s`\n' "$GITHUB_SHA" >> artifacts/release-notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "AwayTime $tag" --draft --prerelease --notes-file artifacts/release-notes.md --generate-notes
          fi
          gh release upload "$tag" artifacts/release/* --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
