name: Foundation tests and build checks
on:
  workflow_call:
env:
  PYTHONUTF8: '1'

permissions:
  contents: read
jobs:
  foundation-and-shell:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        run: rustup show
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Foundation, contracts, web build, and native compile
        run: python scripts/check_phase0.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase0-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/phase0
